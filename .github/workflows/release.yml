name: ByteMap Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    name: Build Packages (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    env:
      CLEAN_SIGNING_KEY: ''
      CLEAN_SIGNING_PASSWORD: ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            targets: 'x86_64-pc-windows-msvc'
            args: ''
            artifact-name: 'ByteMap-Windows-Installers'
            artifact-path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi

          - platform: 'macos-latest'
            targets: 'aarch64-apple-darwin, x86_64-apple-darwin'
            args: '--target universal-apple-darwin'
            artifact-name: 'ByteMap-macOS-Bundle'
            artifact-path: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Add Apple Universal Targets (macOS)
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Run Quality Gate Tests
        run: pnpm test

      - name: Sanitize Signing Key and Secrets
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$RAW_KEY" ]; then
            # Strip any carriage returns, newlines, or spaces that cause base64 decoding errors (e.g. invalid symbol 10)
            CLEAN_KEY=$(printf '%s' "$RAW_KEY" | tr -d '\r\n[:space:]')
            echo "CLEAN_SIGNING_KEY=$CLEAN_KEY" >> $GITHUB_ENV
          else
            echo "CLEAN_SIGNING_KEY=" >> $GITHUB_ENV
          fi

          if [ -n "$RAW_PASSWORD" ]; then
            CLEAN_PASS=$(printf '%s' "$RAW_PASSWORD" | tr -d '\r\n')
            echo "CLEAN_SIGNING_PASSWORD=$CLEAN_PASS" >> $GITHUB_ENV
          else
            echo "CLEAN_SIGNING_PASSWORD=" >> $GITHUB_ENV
          fi

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.CLEAN_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.CLEAN_SIGNING_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'ByteMap v__VERSION__'
          releaseBody: 'See the release assets below to download ByteMap for Windows (.exe / .msi) or macOS (.dmg Universal).'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: warn
